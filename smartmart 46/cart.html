<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartMart | Cart</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#fffaf7;
}

header{
    background:linear-gradient(135deg,#123d73,#ef2868);
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#ffc477;
}

nav a{
    color:white;
    text-decoration:none;
    margin:10px;
}

.container{
    max-width:1000px;
    margin:60px auto;
    padding:20px;
}

h1{
    color:#123d73;
    text-align:center;
    margin-bottom:30px;
}

.item{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 20px #0001;
}

.item h3{
    color:#123d73;
}

.price{
    color:#ef2868;
    font-weight:bold;
}

.remove{
    background:#ef2868;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
}

.total{
    background:#fff0f5;
    padding:25px;
    border-radius:20px;
    text-align:right;
    margin-top:25px;
}

.total h2{
    color:#123d73;
}

.checkout{
    display:inline-block;
    background:#ef2868;
    color:white;
    padding:14px 30px;
    border-radius:30px;
    text-decoration:none;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="logo">Smart<span>Mart</span> 🛍️</div>

<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
<a href="socialmedia.html">Social Media</a>
</nav>
</header>

<div class="container">

<h1>🛒 My Shopping Cart</h1>

<div id="cartItems"></div>

<div class="total">
<h2>Total: ₹<span id="total">0</span></h2>

<a href="checkout.html" class="checkout">
Proceed to Checkout →
</a>
</div>

</div>

<script>

let cart=JSON.parse(localStorage.getItem("smartCart")) || [];

function displayCart(){

    let box=document.getElementById("cartItems");
    let total=0;

    box.innerHTML="";

    if(cart.length===0){
        box.innerHTML="<h2 style='text-align:center;color:#ef2868'>Your cart is empty 🛒</h2>";
        document.getElementById("total").innerText="0";
        return;
    }

    cart.forEach((item,index)=>{

        total += item.price;

        box.innerHTML += `
        <div class="item">
            <div>
                <h3>${item.name}</h3>
                <div class="price">₹${item.price}</div>
            </div>

            <button class="remove" onclick="removeItem(${index})">
                Remove
            </button>
        </div>
        `;
    });

    document.getElementById("total").innerText=total;
}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem("smartCart",JSON.stringify(cart));

    displayCart();
}

displayCart();

</script>

</body>
</html>
