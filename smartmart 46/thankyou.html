<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SmartMart | Thank You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #fff0f5,
        #ffe1c4,
        #e1ecff
    );
}

.card{
    width:90%;
    max-width:650px;
    background:white;
    padding:55px 40px;
    text-align:center;
    border-radius:30px;
    box-shadow:0 20px 50px #0002;
}

.check{
    width:100px;
    height:100px;
    margin:auto;
    background:#ef2868;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
}

h1{
    color:#123d73;
    font-size:40px;
    margin:25px 0 15px;
}

h1 span{
    color:#ef2868;
}

p{
    color:#555;
    font-size:18px;
    line-height:1.6;
}

.order-info{
    margin:25px 0;
    padding:20px;
    background:#fff0f5;
    border-radius:15px;
}

.order-info h3{
    color:#123d73;
    margin-bottom:10px;
}

.buttons{
    margin-top:25px;
}

.btn{
    display:inline-block;
    padding:14px 25px;
    margin:5px;
    border-radius:30px;
    text-decoration:none;
    background:#ef2868;
    color:white;
    font-weight:bold;
}

.btn:hover{
    background:#123d73;
}

</style>

</head>

<body>

<div class="card">

<div class="check">
✓
</div>

<h1>Thank <span>You!</span> 🎉</h1>

<p>
Your order has been placed successfully.
</p>

<p>
Thank you for shopping with <b>SmartMart</b>.
</p>

<div class="order-info">

<h3>🛍️ Order Confirmed</h3>

<p>
Your order will be processed and delivered to your
registered address.
</p>

<p>
We hope to see you again soon! ❤️
</p>

</div>

<div class="buttons">

<a href="index.html" class="btn">
🏠 Back to Home
</a>

<a href="products.html" class="btn">
🛍️ Continue Shopping
</a>

</div>

</div>

</body>
</html>
