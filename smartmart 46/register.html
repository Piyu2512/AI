<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartMart | Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #fff0f5,
        #ffe0c7,
        #e1ecff
    );
}

header{
    background:linear-gradient(135deg,#123d73,#ef2868);
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#ffc477;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

.register-container{
    min-height:calc(100vh - 70px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.register-box{
    width:500px;
    background:white;
    padding:40px;
    border-radius:30px;
    box-shadow:0 20px 50px #0002;
}

.icon{
    width:75px;
    height:75px;
    background:#fff0f5;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    margin:auto;
}

h1{
    text-align:center;
    color:#123d73;
    margin:20px 0 25px;
}

h1 span{
    color:#ef2868;
}

label{
    display:block;
    color:#123d73;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:2px solid #eee;
    border-radius:10px;
    margin-bottom:17px;
    outline:none;
}

input:focus{
    border-color:#ef2868;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:30px;
    background:#ef2868;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#123d73;
}

.login{
    text-align:center;
    margin-top:20px;
}

.login a{
    color:#ef2868;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:600px){

    nav{
        display:none;
    }

    .register-box{
        padding:30px 25px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
Smart<span>Mart</span> 🛍️
</div>

<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
<a href="socialmedia.html">Social Media</a>
</nav>

</header>

<div class="register-container">

<div class="register-box">

<div class="icon">
👤
</div>

<h1>Create <span>Account</span></h1>

<form onsubmit="registerUser(event)">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required
>

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

<label>Mobile Number</label>

<input
type="tel"
id="phone"
placeholder="Enter mobile number"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create password"
required
>

<label>Confirm Password</label>

<input
type="password"
id="confirm"
placeholder="Confirm password"
required
>

<button type="submit">
Create Account 🎉
</button>

</form>

<div class="login">

Already have an account?
<a href="login.html">Login Here</a>

</div>

</div>

</div>

<script>

function registerUser(event){

    event.preventDefault();

    let name=document.getElementById("name").value;
    let email=document.getElementById("email").value;
    let phone=document.getElementById("phone").value;
    let password=document.getElementById("password").value;
    let confirm=document.getElementById("confirm").value;

    if(password !== confirm){

        alert("Passwords do not match! ❌");

        return;
    }

    let users=JSON.parse(
        localStorage.getItem("smartUsers")
    ) || [];

    let exists=users.find(
        u => u.email===email
    );

    if(exists){

        alert(
            "This email is already registered! ❌"
        );

        return;
    }

    users.push({
        name:name,
        email:email,
        phone:phone,
        password:password
    });

    localStorage.setItem(
        "smartUsers",
        JSON.stringify(users)
    );

    alert(
        "Account created successfully! 🎉"
    );

    window.location.href="login.html";
}

</script>

</body>
</html>
