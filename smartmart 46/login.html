<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartMart | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #fff0f5,
        #ffe0c7,
        #e1ecff
    );
}

header{
    background:linear-gradient(135deg,#123d73,#ef2868);
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#ffc477;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

.login-container{
    min-height:calc(100vh - 70px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.login-box{
    width:420px;
    background:white;
    padding:45px;
    border-radius:30px;
    box-shadow:0 20px 50px #0002;
}

.login-icon{
    width:80px;
    height:80px;
    background:#fff0f5;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin:auto;
}

h1{
    text-align:center;
    color:#123d73;
    margin:20px 0 30px;
}

h1 span{
    color:#ef2868;
}

label{
    display:block;
    color:#123d73;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #eee;
    border-radius:10px;
    margin-bottom:20px;
    outline:none;
}

input:focus{
    border-color:#ef2868;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:30px;
    background:#ef2868;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#123d73;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#ef2868;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:600px){
    nav{
        display:none;
    }

    .login-box{
        padding:30px 25px;
    }
}

</style>

</head>

<body>

<header>

<div class="logo">
Smart<span>Mart</span> 🛍️
</div>

<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
<a href="register.html">Register</a>
<a href="socialmedia.html">Social Media</a>
</nav>

</header>

<div class="login-container">

<div class="login-box">

<div class="login-icon">
🔐
</div>

<h1>Welcome <span>Back!</span></h1>

<form onsubmit="loginUser(event)">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
required
>

<button type="submit">
Login 🔐
</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Create Account</a>
</div>

</div>

</div>

<script>

function loginUser(event){

    event.preventDefault();

    let email=document.getElementById("email").value;
    let password=document.getElementById("password").value;

    let users=JSON.parse(localStorage.getItem("smartUsers")) || [];

    let user=users.find(
        u => u.email===email && u.password===password
    );

    if(user){

        localStorage.setItem(
            "loggedUser",
            JSON.stringify(user)
        );

        alert("Login Successful! 🎉");

        window.location.href="index.html";

    }else{

        alert(
            "Invalid email or password.\n"+
            "Please register first."
        );

    }

}

</script>

</body>
</html>
